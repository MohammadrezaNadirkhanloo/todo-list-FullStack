env: development #?

server:
  port: "5005"
  domain: localhost
  runMode: debug #?
  apiBasePath: /api/v1 #?
  readTimeout: 15s
  readHeaderTimeout: 5s
  writeTimeout: 30s
  idleTimeout: 120s
  shutdownTimeout: 20s
  requestTimeout: 25s
  maxBodyBytes: 1048576 # ۱ مگابایت
  insecureCookies: true
  # پشت nginx/ingress، آدرس شبکه‌ی پراکسی را اینجا اضافه کنید.
  trustedProxies: []

postgres:
  host: localhost
  port: "5432"
  user: postgres
  # password: ← فقط از APP_POSTGRES_PASSWORD
  dbName: goclean
  sslMode: disable # در production باید require یا verify-full باشد
  timeZone: UTC
  maxIdleConns: 10
  maxOpenConns: 50
  connMaxLifetime: 30m
  connMaxIdleTime: 5m
  slowQueryThreshold: 200ms

redis:
  host: localhost
  port: "6379"
  # password: ← فقط از APP_REDIS_PASSWORD
  db: 0
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s
  poolSize: 10
  minIdleConns: 2

# ═══════════════════════════════════════════════════════════════════
#  سیاست دسترسی مسیرها  →  docs/auth-flow.md
# ═══════════════════════════════════════════════════════════════════
#
#   enterprise  هر مسیری احراز هویت می‌خواهد؛ هیچ صفحه‌ی عمومی‌ای
#               وجود ندارد. فقط ورود/ثبت‌نام/تازه‌سازی و مسیرهای
#               سلامت باز می‌مانند.
#               → پنل داخلی، داشبورد سازمانی
#
#   public      مسیرهای گروه Public بدون ورود هم کار می‌کنند.
#               → فروشگاه، وبلاگ، هر جایی که مهمان باید ببیند
#
# تغییر این مقدار هیچ خطی از کد مسیرها را عوض نمی‌کند.
auth:
  posture: enterprise

# ═══════════════════════════════════════════════════════════════════
#  مجوزدهی (CASL)  →  docs/authorization.md
# ═══════════════════════════════════════════════════════════════════
#
#   roles  فقط نقش‌های ثابت کد (سطح الف). ساده‌ترین شروع؛ نیازی به
#          مهاجرت ۰۰۰۰۰۳ ندارید.
#   rules  فقط پروفایل‌های پویا از دیتابیس (سطح ب).
#   both   هر دو: نقش‌ها پایه، پروفایل‌ها استثنا. (پیش‌فرض)
authz:
  mode: both
  # ⚠️ هرگز در production خاموش نکنید.
  #
  # قوانینی که به فرانت می‌فرستیم فقط برای *نمایش* است؛ کاربر
  # می‌تواند آن‌ها را در مرورگر ببیند و مستقیم به API درخواست بزند.
  # با enforce=false، هیچ محدودیتی واقعاً اعمال نمی‌شود.
  # اعتبارسنجی پیکربندی جلوی false بودن در production را می‌گیرد.
  enforce: true

jwt:
  # accessSecret / refreshSecret ← فقط از متغیر محیطی
  #
  # توکن دسترسی عمداً کوتاه است: چون قابل باطل‌کردن نیست، تنها دفاع
  # در برابر سرقتش، عمر کوتاه است. توکن تازه‌سازی بلند است ولی
  # قابل باطل‌کردن و یک‌بارمصرف.
  accessTTL: 15m
  refreshTTL: 168h # ۷ روز
  issuer: goclean
  audience: goclean-api

cors:
  # فهرست دقیق origin ها. مقدار "*" در کنار credential مجاز نیست و
  # اعتبارسنجی پیکربندی جلوی اجرا را می‌گیرد.
  allowOrigins:
    - http://localhost:3000
    - http://localhost:5173
  allowCredentials: true
  maxAge: 6h

logger:
  backend: zerolog # zerolog | zap  → docs/logging.md
  level: debug
  encoding: console # در production روی json بگذارید
  # filePath خالی یعنی فقط stdout — رفتار درست برای Docker/Kubernetes.
  # فقط اگر از Filebeat استفاده می‌کنید مقدار بدهید.
  filePath: ""
  # ⚠️ هرگز در production روشن نکنید: بدنه شامل رمز و OTP است.
  logRequestBody: false

# ماژول اختیاری — docs/optional-services/otp-auth.md
#
# با enabled: false (پیش‌فرض) مسیرهای /auth/otp/* اصلاً ثبت نمی‌شوند
# و OtpUsecase ساخته نمی‌شود.
otp:
  enabled: false
  digits: 6
  expireTime: 2m
  resendDelay: 90s
  maxAttempts: 5

password:
  minLength: 12
  maxLength: 128
  includeDigits: true
  includeUppercase: true
  includeLowercase: true
  includeSymbols: false
  # پارامترهای Argon2id بر اساس توصیه‌ی OWASP.
  # اگر سرور شما ضعیف است می‌توانید argon2Memory را کم کنید، ولی
  # زیر 19456 (19 MiB) نروید.
  argon2Memory: 65536 # 64 MiB
  argon2Iterations: 3
  argon2Parallelism: 2

ratelimit:
  enabled: true
  globalRPS: 20
  globalBurst: 40
  # مسیرهای ورود بسیار سخت‌گیرانه‌تر: ۱ درخواست هر ۵ ثانیه
  authRPS: 0.2
  authBurst: 5
  # ارسال OTP هزینه‌ی واقعی دارد (پیامک): حدود ۱ در دقیقه
  otpRPS: 0.017
  otpBurst: 2
  idleTTL: 15m
  maxKeys: 100000

pagination:
  defaultPageSize: 20
  # سقف سخت — جلوی درخواست pageSize=1000000 را می‌گیرد.
  maxPageSize: 100
