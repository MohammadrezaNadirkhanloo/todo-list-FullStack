env: development

server:
  port: "8080"
  runMode: debug
  readTimeout: 10s
  writeTimeout: 15s
  shutdownTimeout: 15s
  readHeaderTimeout: 5s
  idleTimeout: 120s
  trustedProxies: []

postgres:
  host: localhost
  port: "5432"
  user: postgres
  # password: ← فقط از APP_POSTGRES_PASSWORD
  dbName: tododb
  sslMode: disable
  timeZone: UTC
  maxIdleConns: 10
  maxOpenConns: 50
  connMaxLifetime: 30m
  connMaxIdleTime: 5m
  slowQueryThreshold: 200ms
