# ═══════════════════════════════════════════════════════════════════
#  پیکربندی production — کامل و خودبسنده
# ═══════════════════════════════════════════════════════════════════
#
# ⚠️ قانون طلایی، مثل config.yml: هیچ رازی اینجا ننویسید.
# این فایل هم در گیت commit می‌شود.
#
# ── چطور فعال می‌شود ──
#
#   APP_ENV=production
#
# با این متغیر، loader ابتدا config.yml و سپس *این* فایل را ادغام
# می‌کند. جزئیات ترتیب اولویت در docs/devops-guide.md.
#
# ── چرا این فایل «کامل» است و نه فقط چند کلید override شده ──
#
# از نظر فنی، loader اجازه می‌دهد این فایل فقط تفاوت‌ها را داشته
# باشد. عمداً این کار را نکرده‌ایم.
#
# دلیل: پیکربندی production چیزی است که در یک حادثه، ساعت سه بامداد،
# باید بتوانید بازش کنید و *کل* وضعیت سیستم را ببینید — نه اینکه
# مجبور باشید ذهنی آن را با فایل دیگری ادغام کنید و حدس بزنید کدام
# مقدار از کجا آمده.
#
# هزینه‌اش تکرار است. سودش این است که هر مقدار مؤثر در production
# دقیقاً یک جا نوشته شده و همان‌جا هم خوانده می‌شود.
#
# ⚠️ نتیجه‌ی عملی: اگر کلیدی را به config.yml اضافه کردید و مقدارش
# در production باید فرق کند، اینجا هم اضافه‌اش کنید.

env: production

server:
  port: "5005"
  # ⚠️ باید دامنه‌ی واقعی باشد — روی کوکی و لینک‌ها اثر دارد.
  # از APP_SERVER_DOMAIN بدهید.
  domain: localhost
  # release: مسیرها و اطلاعات داخلی gin دیگر چاپ نمی‌شوند.
  # اعتبارسنجی مقدار debug را در production رد می‌کند.
  runMode: release
  apiBasePath: /api/v1

  # ── تایم‌اوت‌ها ──
  #
  # سخت‌گیرانه‌تر از توسعه. هر اتصال باز، یک slot از استخر اتصال
  # است؛ اتصال کند یا رهاشده منابع را نگه می‌دارد.
  #
  # ⚠️ اگر endpoint ای دارید که ذاتاً کند است (خروجی CSV بزرگ،
  # گزارش سنگین)، writeTimeout را برای *همه* بالا نبرید — آن مسیر
  # را استریم کنید یا به کار پس‌زمینه منتقل کنید.
  readTimeout: 15s
  readHeaderTimeout: 5s
  writeTimeout: 30s
  idleTimeout: 120s
  # بلندتر از توسعه: به درخواست‌های در جریان فرصت اتمام می‌دهد
  # پیش از آنکه کانتینر کشته شود.
  #
  # ⚠️ این مقدار باید *کمتر* از terminationGracePeriodSeconds در
  # Kubernetes یا stop_grace_period در compose باشد، وگرنه بی‌اثر
  # است.
  shutdownTimeout: 30s
  requestTimeout: 25s
  maxBodyBytes: 1048576 # ۱ مگابایت

  # ⚠️ false اجباری است. کوکی توکن تازه‌سازی فقط روی HTTPS.
  # اعتبارسنجی مقدار true را در production رد می‌کند.
  insecureCookies: false

  # ⚠️ اجباری در production — اعتبارسنجی فهرست خالی را رد می‌کند.
  #
  # بدون این، هر کسی می‌تواند با هدر X-Forwarded-For جعلی مقدار
  # ClientIP را کنترل کند: محدودیت نرخ دور زده می‌شود و لاگ‌ها با
  # IP جعلی پر می‌شوند.
  #
  # مقدار = شبکه‌ی پراکسی شما، نه 0.0.0.0/0.
  # از APP_SERVER_TRUSTEDPROXIES بدهید (با کاما جدا کنید).
  trustedProxies:
    - 10.0.0.0/8

postgres:
  host: postgres
  port: "5432"
  user: goclean_app # ⚠️ نه postgres — کاربر با حداقل دسترسی
  # password: ← فقط از APP_POSTGRES_PASSWORD (بدون پیش‌فرض)
  dbName: goclean

  # ⚠️ disable در production توسط اعتبارسنجی رد می‌شود.
  #
  #   require      رمزنگاری می‌شود ولی گواهی بررسی نمی‌شود
  #   verify-full  گواهی و نام میزبان هم بررسی می‌شوند ← امن‌ترین
  #
  # اگر دیتابیس مدیریت‌شده دارید (RDS، Cloud SQL، ArvanCloud)،
  # verify-full را انتخاب کنید و گواهی CA را mount کنید.
  sslMode: require
  timeZone: UTC

  # ── استخر اتصال ──
  #
  # ⚠️ سقف واقعی، max_connections خودِ PostgreSQL است (پیش‌فرض ۱۰۰).
  # فرمول: maxOpenConns × تعداد نمونه‌های برنامه ≤ max_connections − ۱۰
  #
  # با ۱۰۰ اتصال و ۳ نمونه: 100 × 3 = 300 ≫ 100 → خطای
  # "too many connections" زیر بار.
  #
  # مقادیر زیر برای *یک* نمونه با max_connections=200 حساب شده‌اند.
  # اگر چند نمونه دارید یا PgBouncer در میان است، تقسیم کنید.
  maxOpenConns: 50
  maxIdleConns: 25
  # اتصال‌های کهنه بسته می‌شوند تا لودبالانسر دیتابیس بتواند
  # ترافیک را دوباره توزیع کند.
  connMaxLifetime: 30m
  connMaxIdleTime: 5m
  # سخت‌گیرانه‌تر از توسعه: هر کوئری کندتر از این لاگ می‌شود.
  slowQueryThreshold: 100ms

redis:
  host: redis
  port: "6379"
  # password: ← فقط از APP_REDIS_PASSWORD
  # ⚠️ در production خالی بودنش توسط اعتبارسنجی رد می‌شود.
  db: 0
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s
  # ⚠️ Redis تک‌رشته‌ای است؛ استخر بزرگ سرعت را زیاد نمی‌کند،
  # فقط جلوی صف‌شدن پشت اتصال را می‌گیرد.
  #
  # قاعده‌ی سرانگشتی: هم‌اندازه‌ی maxOpenConns دیتابیس یا کمی
  # بیشتر — چون هر درخواست ممکن است هر دو را لمس کند.
  poolSize: 50
  minIdleConns: 10

auth:
  # enterprise = هر مسیری احراز هویت می‌خواهد.
  # اگر سایت شما بخش عمومی دارد، public بگذارید.
  # → docs/auth-flow.md
  posture: enterprise

authz:
  mode: both
  # ⚠️ اعتبارسنجی مقدار false را در production رد می‌کند.
  enforce: true

jwt:
  # accessSecret / refreshSecret ← فقط از متغیر محیطی، بدون پیش‌فرض.
  # تولید: openssl rand -base64 48
  accessTTL: 15m
  refreshTTL: 168h # ۷ روز
  # ⚠️ issuer و audience را به نام واقعی سرویس خود تغییر دهید.
  # اگر چند سرویس با یک کلید امضا می‌کنند، این‌ها تنها چیزی هستند
  # که توکن یک سرویس را از دیگری جدا می‌کنند.
  issuer: goclean
  audience: goclean-api

cors:
  # ⚠️ این مقدار یک جای‌نگهدار است و باید عوض شود.
  #
  # اعتبارسنجی در production:
  #   • مقدار "*" را رد می‌کند
  #   • فهرست خالی را رد می‌کند
  #
  # ولی نمی‌تواند بفهمد که example.com دامنه‌ی شما نیست — این یکی
  # با شماست.
  #
  # از APP_CORS_ALLOWORIGINS بدهید (با کاما جدا کنید).
  allowOrigins:
    - https://app.example.com

  # ⚠️ نکته‌ی امنیتی مهم:
  #
  # allowCredentials یعنی مرورگر کوکی را همراه درخواست
  # cross-origin می‌فرستد. این با "*" ترکیب‌شدنی نیست — و
  # اعتبارسنجی این ترکیب را در *همه‌ی* محیط‌ها رد می‌کند، نه فقط
  # production.
  #
  # میان‌افزار هم هرگز "*" را کنار credential برنمی‌گرداند؛
  # دقیقاً همان origin درخواست را بازتاب می‌دهد و فقط اگر در
  # فهرست بالا باشد.
  #
  # اگر API شما کوکی نمی‌خواهد (مثلاً فقط Bearer token)، این را
  # false کنید — سطح حمله کوچک‌تر می‌شود.
  allowCredentials: true
  maxAge: 6h

logger:
  backend: zerolog
  # ⚠️ debug در production توسط اعتبارسنجی رد می‌شود.
  # info برای شروع؛ اگر حجم لاگ زیاد شد warn.
  level: info
  # ⚠️ json اجباری عملی است: هیچ جمع‌کننده‌ی لاگی (Loki، ELK،
  # CloudWatch) خروجی console را ساخت‌یافته پارس نمی‌کند.
  encoding: json
  # خالی = فقط stdout. رفتار درست برای Docker/Kubernetes:
  # نوشتن در فایل داخل کانتینر یعنی لاگ با کانتینر می‌میرد.
  filePath: ""
  # ⚠️ اعتبارسنجی مقدار true را در production رد می‌کند.
  # بدنه‌ی درخواست شامل رمز، OTP و توکن است.
  logRequestBody: false

otp:
  # → docs/optional-services/otp-auth.md
  enabled: false
  digits: 6
  expireTime: 2m
  resendDelay: 90s
  maxAttempts: 5

password:
  minLength: 12
  maxLength: 128
  includeDigits: true
  includeUppercase: true
  includeLowercase: true
  includeSymbols: false
  # ⚠️ این مقادیر را در production *کم نکنید*.
  #
  # Argon2id عمداً کند است. هر کاهشی اینجا، حمله‌ی brute-force
  # آفلاین روی هش‌های دزدیده‌شده را ارزان‌تر می‌کند.
  #
  # اگر ورود کند است، مشکل معمولاً argon2Parallelism در برابر
  # تعداد هسته است، نه memory.
  argon2Memory: 65536 # 64 MiB
  argon2Iterations: 3
  argon2Parallelism: 2

ratelimit:
  enabled: true

  # ── تنظیم برای ترافیک واقعی ──
  #
  # ⚠️ مقادیر توسعه (globalRPS: 20) برای production *خیلی سخت‌گیرانه*
  # است: یک کاربر عادی که یک صفحه‌ی داشبورد را باز می‌کند ممکن است
  # ۱۰ تا ۱۵ درخواست هم‌زمان بزند و بلافاصله ۴۲۹ بگیرد.
  #
  # این نرخ به‌ازای هر کلید (IP یا کاربر) است، نه کل سیستم.
  #
  # روش تنظیم: از یک مقدار سخاوتمندانه شروع کنید، متریک
  # ratelimit_rejected_total را نگاه کنید، و کم کنید — نه برعکس.
  # محدودیت نرخ خیلی سخت، یک قطعی خودخواسته است.
  globalRPS: 50
  globalBurst: 100

  # ورود همچنان سخت‌گیرانه می‌ماند: هدف اینجا کندکردن حمله‌ی
  # اعتبارنامه است، نه راحتی کاربر. کسی که رمزش را درست می‌داند،
  # بیش از یکی دو بار در چند ثانیه ورود نمی‌زند.
  authRPS: 0.2 # ۱ درخواست هر ۵ ثانیه
  authBurst: 5

  # OTP هزینه‌ی واقعی پول دارد (پیامک).
  otpRPS: 0.017 # ~۱ در دقیقه
  otpBurst: 2

  idleTTL: 15m
  # ⚠️ حافظه‌ی مصرفی ≈ maxKeys × ~۱۰۰ بایت.
  # با ۵۰۰ هزار کلید ≈ ۵۰ مگابایت. اگر کانتینر محدودیت حافظه‌ی
  # کمی دارد، این را کم کنید.
  maxKeys: 500000

pagination:
  defaultPageSize: 20
  # سقف سخت. بالا بردنش یعنی اجازه دادن به یک درخواست که کل
  # جدول را بکشد.
  maxPageSize: 100
